<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>穹顶从外面看为什么“球里套圆”</title>
<style>
  html, body { margin: 0; background: #0a111a; color: #dbe7f5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { width: 1240px; margin: 0 auto; padding: 26px 0 34px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #7e93ab; margin-bottom: 16px; }
  svg { display: block; }
  text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>穹顶从外面看为什么“球里套圆”</h1>
  <div class="sub">一个球有内外两层壳，投影到屏幕上是同一片区域。写不写深度，决定了远侧那层会不会被画出来。</div>

  <svg width="1240" height="700" viewBox="0 0 1240 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skyFill" cx="50%" cy="74%" r="72%">
        <stop offset="0%" stop-color="#c7e4f6"/>
        <stop offset="42%" stop-color="#5f9fd8"/>
        <stop offset="100%" stop-color="#0f2b47"/>
      </radialGradient>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb8e0"/>
      </marker>
      <marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9e6b"/>
      </marker>
    </defs>

    <!-- ═════════ 左：depthWrite = false ═════════ -->
    <g>
      <rect x="24" y="22" width="580" height="646" rx="14" fill="#0e1926" stroke="#1d2f45"/>
      <text x="52" y="58" fill="#eaf3ff" font-size="16" font-weight="600">① 改之前：depthWrite = false</text>
      <text x="52" y="82" fill="#7e93ab" font-size="12.5">天空盒不写深度 —— 远侧内壁没被挡住，也被画了出来</text>

      <text x="52" y="120" fill="#9fb4ca" font-size="12">剖面：一束视线前后撞到两层壳</text>

      <circle cx="300" cy="252" r="118" fill="#0d1b29" stroke="#2f5375" stroke-width="2"/>
      <circle cx="300" cy="252" r="118" fill="none" stroke="#4d8fd0" stroke-width="8" opacity="0.55"/>
      <circle cx="300" cy="252" r="118" fill="none" stroke="#ff9e6b" stroke-width="2.5" stroke-dasharray="7 7"/>

      <g transform="translate(486,252)">
        <rect x="-28" y="-21" width="46" height="42" rx="7" fill="#1b2c3f" stroke="#5f8dbb"/>
        <circle cx="24" cy="0" r="13" fill="#0d1724" stroke="#5f8dbb"/>
        <circle cx="24" cy="0" r="5.5" fill="#8fc4ff"/>
        <text x="-5" y="46" fill="#9fb4ca" font-size="12" text-anchor="middle">相机</text>
      </g>

      <line x1="468" y1="252" x2="422" y2="252" stroke="#8fb8e0" stroke-width="2.4" marker-end="url(#ar)"/>
      <circle cx="418" cy="252" r="6.5" fill="#66a9ff" stroke="#0a111a" stroke-width="2"/>
      <line x1="414" y1="252" x2="186" y2="252" stroke="#ff9e6b" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arO)"/>
      <circle cx="182" cy="252" r="6.5" fill="#ff9e6b" stroke="#0a111a" stroke-width="2"/>

      <circle cx="70" cy="398" r="5" fill="#66a9ff"/>
      <text x="84" y="402" fill="#8fc4ff" font-size="12.5">近端外壁（正面）—— 画上去了</text>
      <circle cx="70" cy="422" r="5" fill="#ff9e6b"/>
      <text x="84" y="426" fill="#ffb98a" font-size="12.5">远端内壁（背面）—— 没被挡住，也画了</text>

      <text x="52" y="466" fill="#9fb4ca" font-size="12">深度缓冲</text>
      <rect x="52" y="474" width="156" height="28" rx="5" fill="#101c29" stroke="#283c52"/>
      <text x="130" y="493" fill="#63809c" font-size="11.5" text-anchor="middle">空 —— 后面的面照样覆盖</text>

      <text x="52" y="536" fill="#9fb4ca" font-size="12">屏幕上看到的样子</text>
      <circle cx="300" cy="608" r="66" fill="url(#skyFill)" stroke="#4d8fd0" stroke-width="1.5"/>
      <circle cx="300" cy="608" r="42" fill="url(#skyFill)" stroke="#ff9e6b" stroke-width="1.5" stroke-dasharray="5 5"/>
      <line x1="350" y1="580" x2="392" y2="560" stroke="#8fc4ff" stroke-width="1.4" marker-end="url(#ar)"/>
      <text x="398" y="556" fill="#8fc4ff" font-size="11.5">近壁画的</text>
      <line x1="344" y1="628" x2="392" y2="646" stroke="#ffb98a" stroke-width="1.4" marker-end="url(#arO)"/>
      <text x="398" y="652" fill="#ffb98a" font-size="11.5">远壁画的</text>
      <text x="176" y="608" fill="#c7d8ea" font-size="12.5" text-anchor="end">两层叠在一起</text>
      <text x="176" y="627" fill="#c7d8ea" font-size="12.5" text-anchor="end">→ 看着像球里套个圆</text>
    </g>

    <!-- ═════════ 右：depthWrite = true ═════════ -->
    <g>
      <rect x="636" y="22" width="580" height="646" rx="14" fill="#0e1926" stroke="#1d2f45"/>
      <text x="664" y="58" fill="#eaf3ff" font-size="16" font-weight="600">② 改之后：depthWrite = true</text>
      <text x="664" y="82" fill="#7e93ab" font-size="12.5">像普通不透明球体一样写深度 —— 远侧内壁被正确遮挡</text>

      <text x="664" y="120" fill="#9fb4ca" font-size="12">剖面：视线在近壁就被“记账”了</text>

      <circle cx="912" cy="252" r="118" fill="#0d1b29" stroke="#2f5375" stroke-width="2"/>
      <circle cx="912" cy="252" r="118" fill="none" stroke="#4d8fd0" stroke-width="8" opacity="0.8"/>
      <circle cx="912" cy="252" r="118" fill="none" stroke="#54687c" stroke-width="2.5" stroke-dasharray="7 7"/>

      <g transform="translate(1098,252)">
        <rect x="-28" y="-21" width="46" height="42" rx="7" fill="#1b2c3f" stroke="#5f8dbb"/>
        <circle cx="24" cy="0" r="13" fill="#0d1724" stroke="#5f8dbb"/>
        <circle cx="24" cy="0" r="5.5" fill="#8fc4ff"/>
        <text x="-5" y="46" fill="#9fb4ca" font-size="12" text-anchor="middle">相机</text>
      </g>

      <line x1="1080" y1="252" x2="1034" y2="252" stroke="#8fb8e0" stroke-width="2.4" marker-end="url(#ar)"/>
      <circle cx="1030" cy="252" r="6.5" fill="#66a9ff" stroke="#0a111a" stroke-width="2"/>
      <line x1="1026" y1="252" x2="880" y2="252" stroke="#44576b" stroke-width="1.8" stroke-dasharray="4 9"/>
      <g stroke="#e06666" stroke-width="3" opacity="0.95">
        <line x1="900" y1="242" x2="916" y2="262"/>
        <line x1="916" y1="242" x2="900" y2="262"/>
      </g>

      <circle cx="682" cy="398" r="5" fill="#66a9ff"/>
      <text x="696" y="402" fill="#8fc4ff" font-size="12.5">近端外壁 —— 写入深度</text>
      <circle cx="682" cy="422" r="5" fill="#54687c"/>
      <text x="696" y="426" fill="#93a4b4" font-size="12.5">远端内壁 —— 深度测试不通过，丢弃</text>

      <text x="664" y="466" fill="#9fb4ca" font-size="12">深度缓冲</text>
      <rect x="664" y="474" width="156" height="28" rx="5" fill="#101c29" stroke="#283c52"/>
      <rect x="667" y="477" width="150" height="22" rx="3" fill="#1d4a6b"/>
      <text x="742" y="493" fill="#9fd0ff" font-size="11.5" text-anchor="middle">记下近壁的距离</text>

      <text x="664" y="536" fill="#9fb4ca" font-size="12">屏幕上看到的样子</text>
      <circle cx="912" cy="608" r="66" fill="url(#skyFill)" stroke="#4d8fd0" stroke-width="1.5"/>
      <line x1="962" y1="580" x2="1004" y2="560" stroke="#8fc4ff" stroke-width="1.4" marker-end="url(#ar)"/>
      <text x="1010" y="556" fill="#8fc4ff" font-size="11.5">只有近壁这一层</text>
      <text x="788" y="608" fill="#c7d8ea" font-size="12.5" text-anchor="end">一个干净的实心球</text>
      <text x="788" y="627" fill="#c7d8ea" font-size="12.5" text-anchor="end">→ 不再套圆</text>
    </g>

    <text x="620" y="690" fill="#9fd0ff" font-size="13" text-anchor="middle">结论：穹顶参与深度写入后，球外看到的只有近端一层壳 —— “套着的圆”消失。</text>
  </svg>
</div>
</body>
</html>
