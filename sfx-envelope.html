<text x="70" y="30" fill="#e9f0f8" font-size="20" font-weight="600">Lotus Elise 引擎录音：20 ms 峰值包络（上）+ RMS 响度曲线（下）</text>
<text x="70" y="52" fill="#8ea3bd" font-size="14">每根竖线 = 该 20 ms 窗口内的最大振幅；黄线 = 同一窗口的 RMS（换成 dB）</text>

<text x="70" y="682" fill="#b7c7dc" font-size="14">① 把音频按 20 ms 一窗“切片”，每窗算两个数：最大振幅（上图竖线）与 RMS 响度（下图黄线）。</text>
<text x="70" y="708" fill="#b7c7dc" font-size="14">② 51 秒的音频就被压成一条曲线：哪里吵、哪里轻、哪里一直不变，一眼能看出来 —— 这就是“包络”。</text>
